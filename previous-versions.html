<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Previous Versions - nXt</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #f5f5f7;
  color: #1c1c1e;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 28px;
  padding: 26px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

h1 {
  margin-top: 0;
}

p {
  color: #6e6e73;
  line-height: 1.5;
}

.version {
  border: 1px solid #d1d1d6;
  border-radius: 18px;
  padding: 14px;
  margin-top: 12px;
}

.version strong {
  display: block;
  margin-bottom: 4px;
}

.back {
  display: inline-block;
  margin-top: 20px;
  text-decoration: none;
  color: white;
  background: #007aff;
  padding: 12px 18px;
  border-radius: 14px;
  font-weight: 700;
}

@media (prefers-color-scheme: dark) {
  body {
    background: #000;
    color: white;
  }

  .card {
    background: #1c1c1e;
  }

  .version {
    border-color: #3a3a3c;
  }
}
</style>
</head>

<body>

<main class="card">
  <h1>Previous Versions</h1>

  <p>
    Placeholder text for older nXt releases.
  </p>

  <div class="version">
    <strong>nXt v1.0</strong>
    <p>Placeholder description and download URL.</p>
  </div>

  <div class="version">
    <strong>nXt beta</strong>
    <p>Placeholder description and download URL.</p>
  </div>

  <a class="back" href="index.html">Back to nXt</a>
</main>

</body>
</html>
